<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Economic Forum 2026 – Check-in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ICOCMN redesign palette (from the website prototypes; no saffron):
     navy #1b3f75, deep navy #16335f, ink #1b1c20, paper #f4f3f1, white,
     sky #d6e3f5, mist #e3e9f3, slate #4a6b9d, muted #6f6e72 */
  :root{--navy:#1b3f75;--navy-dk:#16335f;--slate:#4a6b9d;--sky:#d6e3f5;--mist:#e3e9f3;--paper:#f4f3f1;--ink:#1b1c20;--muted:#6f6e72;--line:#e3e9f3;--ok:#196236;--ok-bg:#e3f1e7;--err:#b00020}
  *{box-sizing:border-box}
  body{font-family:Barlow,system-ui,sans-serif;margin:0;background:var(--paper);color:var(--ink);font-size:18px;line-height:1.35;-webkit-font-smoothing:antialiased}
  header{background:var(--navy);color:var(--paper);position:sticky;top:0;z-index:2;border-bottom:6px solid var(--navy-dk)}
  .hbar{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:820px;margin:0 auto}
  .logo{width:44px;height:auto;flex:none;background:var(--paper);padding:4px}
  .brand{flex:1;min-width:0}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--sky)}
  h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0;line-height:1.1}
  h1 span{color:var(--sky)}
  #stats{font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--sky);color:var(--navy-dk);padding:8px 12px;white-space:nowrap}
  #stats:empty{display:none}
  .tabs{display:flex;max-width:820px;margin:0 auto;padding:0 16px;gap:4px}
  .tabs.hidden{display:none}
  .tab{flex:1;min-width:0;min-height:48px;padding:0 6px;white-space:nowrap;background:transparent;color:var(--sky);border-bottom:4px solid transparent;font-size:15px}
  .tab.on{color:#fff;border-bottom-color:#fff}
  main{padding:16px;max-width:820px;margin:0 auto}
  .label{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--navy);margin:4px 0 8px}
  .row{display:flex;gap:8px}
  input{font-family:inherit;font-size:20px;font-weight:500;padding:14px;border:2px solid var(--navy);border-radius:0;width:100%;background:#fff;color:var(--ink);min-height:58px}
  input:focus{outline:3px solid var(--slate);outline-offset:0}
  button{font-family:inherit;font-size:16px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;min-height:58px;padding:0 20px;border:0;border-radius:0;cursor:pointer}
  button:disabled{opacity:.6}
  .primary{background:var(--navy);color:var(--paper)}
  .secondary{background:#fff;color:var(--navy);border:2px solid var(--navy)}
  .card{background:#fff;padding:18px 18px 20px;margin:14px 0;border-top:4px solid var(--navy);box-shadow:0 1px 2px rgba(27,28,32,.08)}
  .name{font-size:26px;font-weight:800;letter-spacing:-.015em;line-height:1.1}
  .guest{display:inline-block;margin-top:6px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);border-left:4px solid var(--slate);padding:2px 8px;background:var(--mist)}
  .ticket{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
  .meta{color:var(--muted);font-size:15px;font-weight:500}
  .table{display:inline-block;font-size:26px;font-weight:800;letter-spacing:-.01em;color:var(--navy-dk);background:var(--sky);border-left:6px solid var(--navy);padding:6px 14px;margin:8px 0}
  .escort{display:block;font-size:16px;font-weight:700;color:var(--navy-dk);background:var(--mist);border:1px solid var(--sky);border-radius:8px;padding:8px 12px;margin:2px 0 8px}
  .table.general{display:block;font-size:17px;font-weight:700;letter-spacing:0;color:var(--navy);background:var(--mist);border-left:0;padding:10px 12px}
  .status{font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
  .status.yes{color:var(--ok);background:var(--ok-bg);display:inline-block;padding:6px 10px;font-size:17px}
  .status.no{color:var(--muted)}
  .btn-in{background:var(--navy);color:var(--paper);width:100%;margin-top:10px;font-size:19px;min-height:62px}
  .btn-in:active{background:var(--navy-dk)}
  .btn-out{background:#fff;color:var(--err);border:2px solid var(--err);width:100%;margin-top:10px;min-height:58px}
  #msg{margin:12px 0;min-height:22px;font-weight:600;color:var(--navy)}.err{color:var(--err);font-weight:700}
  .hidden{display:none}
  /* Program timeline */
  .pbanner{background:var(--navy);color:#fff;padding:14px 16px;font-weight:800;font-size:20px;margin-bottom:10px}
  .pbanner small{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--sky);font-weight:700}
  .tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:3px solid var(--mist)}
  .seg{scroll-margin-top:180px;position:relative;background:#fff;margin:10px 0;padding:12px 14px;box-shadow:0 1px 2px rgba(27,28,32,.08)}
  .seg:before{content:"";position:absolute;left:-27px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--slate);border:3px solid var(--paper)}
  .seg .t{font-size:14px;font-weight:800;letter-spacing:.06em;color:var(--slate)}
  .seg .ti{font-size:19px;font-weight:800;line-height:1.15;margin-top:2px}
  .seg .who{font-size:14px;color:var(--muted);margin-top:3px}
  .seg .tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.14em;padding:3px 8px;margin-left:8px;vertical-align:1px}
  .seg.past{opacity:.45;box-shadow:none;background:transparent}
  .seg.past:before{background:#9b9b9e}
  .seg.now{border-left:6px solid var(--ok);background:#fff}
  .seg.now:before{background:var(--ok);width:16px;height:16px;left:-29px}
  .seg.now .ti{font-size:23px}
  .seg.now .tag{background:var(--ok);color:#fff}
  .seg.next{border-left:6px solid var(--navy);background:var(--sky)}
  .seg.next:before{background:var(--navy)}
  .seg.next .tag{background:var(--navy);color:#fff}
  .seg .in{font-size:15px;font-weight:800;color:var(--navy-dk);margin-top:4px}
  /* Team (volunteer points of contact) */
  .team{display:grid;grid-template-columns:1fr;gap:12px}
  .team .card{margin:0}
  .team .role{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--slate);margin-bottom:8px}
  .team .people{display:flex;flex-wrap:wrap;gap:8px}
  .team .person{font-size:20px;font-weight:800;color:var(--navy-dk);background:var(--sky);border-left:4px solid var(--navy);padding:6px 12px}
  @media (min-width:700px){
    .team{grid-template-columns:1fr 1fr}

    .logo{width:56px}
    h1{font-size:28px}
    .kicker{font-size:12px}
    .name{font-size:30px}
  }
.tlabel{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5a6b85;margin-top:8px}
  .newsearch{display:block;width:100%;margin:12px 0 24px;padding:14px;font-size:16px}
</style>
</head>

      <button class="primary" id="pinBtn">Unlock</button>
    </div>
  </section>
  <section id="appView" class="hidden">
    <p class="label">Guest check-in</p>
    <div class="row">
      <input id="q" type="search" placeholder="Search name (min 2 letters)" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="secondary" id="clearBtn">Search</button>
    </div>
  </section>
  <section id="programView" class="hidden">
    <div id="pbanner" class="pbanner"></div>
    <ol id="timeline" class="tl"></ol>
  </section>
  <section id="teamView" class="hidden">
    <p class="label">Volunteer points of contact</p>
    <div id="team" class="team"></div>
  </section>
  <div id="msg"></div>
  <div id="results"></div>
</main>
<script>
(function () {
  var PIN_KEY = 'deskPin';
  var timer = null, seq = 0;
  var $ = function (id) { return document.getElementById(id); };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function msg(text, isErr) { $('msg').innerHTML = text ? '<span class="' + (isErr ? 'err' : '') + '">' + esc(text) + '</span>' : ''; }
  function pin() { return sessionStorage.getItem(PIN_KEY) || ''; }

  // Apps Script /exec URL of the JSON API deployment.
  var API_URL = window.API_URL_OVERRIDE || 'https://script.google.com/macros/s/AKfycbys0i9-ygWX6ZuAECvrojj-JGxhPrYR6aSZmwb5i_6L2p_OvaRwyQmEH2vTyY8IzFZWBQ/exec';
  function api(payload) {
    // text/plain = "simple" CORS request: no preflight, which Apps Script cannot answer.
    return fetch(API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function (r) { if (!r.ok) throw new Error('Server error ' + r.status); return r.json(); })
      .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || 'Request failed'); return j.data; })
      .catch(function (e) {
        if (e instanceof TypeError) throw new Error('Network error, check connection and try again');
        throw e;
      });
  }
  function call(action, extra, ok) {
    var payload = { action: action, pin: pin() };
    for (var k in extra) payload[k] = extra[k];
    api(payload).then(ok, function (e) {
      var m = (e && e.message) || String(e);
      if (/Invalid PIN/i.test(m)) { lock(); }
      msg(m, true);
    });
  }

  function lock() {
    sessionStorage.removeItem(PIN_KEY);
    $('appView').classList.add('hidden'); $('pinView').classList.remove('hidden');
    $('results').innerHTML = ''; $('stats').textContent = '';
    $('tabs').classList.add('hidden'); $('programView').classList.add('hidden');
    $('teamView').classList.add('hidden');
    stopProgram(); tab = 'checkin';
  }
  function unlocked() {
    $('pinView').classList.add('hidden'); $('tabs').classList.remove('hidden');
    showTab(tab); refreshStats();
  }

  // ---- Tabs ----
  var tab = 'checkin';
  function showTab(name) {
    tab = name;
    var btns = document.querySelectorAll('.tab');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-tab') === name);
    var isP = name === 'program', isT = name === 'team', isC = !isP && !isT;
    $('appView').classList.toggle('hidden', !isC);
    $('results').classList.toggle('hidden', !isC);
    $('programView').classList.toggle('hidden', !isP);
    $('teamView').classList.toggle('hidden', !isT);
    msg('');
    if (isT) renderTeam();
    if (isP) startProgram(); else { stopProgram(); if (isC) $('q').focus(); }
  }
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('.tab'); if (b) showTab(b.getAttribute('data-tab'));
  });

  // ---- Team (static, names only) ----
  var TEAM = [
    { role: 'Check-in desk', people: ['Vidya', 'Twisha', 'Sarayu'] },
    { role: 'Panelists / VIP ushering', people: ['Pooja'] },
    { role: 'Lawmakers', people: ['Vallabha'] },
    { role: 'Booths', people: ['Dhruv'] },
    { role: 'Presentation / AV', people: ['Ved'] },
    { role: 'Food', people: ['Pallavi'] }
  ];
  function renderTeam() {
    $('team').innerHTML = TEAM.map(function (g) {
      return '<div class="card"><div class="role">' + esc(g.role) + '</div><div class="people">' +
        g.people.map(function (p) { return '<span class="person">' + esc(p) + '</span>'; }).join('') + '</div></div>';
    }).join('');
  }

  // ---- Program ----
  var program = null, ptimer = null;
  function toMin(hhmm) { var p = String(hhmm).split(':'); return Number(p[0]) * 60 + Number(p[1]); }
  function fmt(hhmm) {
    var m = toMin(hhmm), h = Math.floor(m / 60), mm = m % 60;
    return (h % 12 || 12) + ':' + (mm < 10 ? '0' : '') + mm + ' ' + (h < 12 ? 'AM' : 'PM');
  }
  function nowMin() {
    // window.PREVIEW_NOW ("HH:MM") is only set by preview.html for screenshots.
    if (window.PREVIEW_NOW && /^\d{1,2}:\d{2}$/.test(window.PREVIEW_NOW)) return toMin(window.PREVIEW_NOW);
    var parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Chicago', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date());
    var h = 0, m = 0;
    parts.forEach(function (p) { if (p.type === 'hour') h = Number(p.value); if (p.type === 'minute') m = Number(p.value); });
    return h * 60 + m;
  }
  function startProgram() {
    stopProgram();
    if (program) renderProgram();
    call('program', {}, function (p) { program = p; renderProgram(); });
    ptimer = setInterval(function () { if (program) renderProgram(); }, 30000);
  }
  function stopProgram() { if (ptimer) { clearInterval(ptimer); ptimer = null; } }
  function renderProgram() {
    var items = program.items || [], n = nowMin(), startM = toMin(program.programStart);
    var nowIdx = -1, nextIdx = -1;
    for (var i = 0; i < items.length; i++) {
      var s = toMin(items[i].start), e = items[i].end ? toMin(items[i].end) : 24 * 60;
      if (n >= s && n < e) nowIdx = i;
      if (nextIdx < 0 && s > n) nextIdx = i;
    }
    var banner;
    if (n < toMin(items[0].start)) { banner = '<small>Before the event</small>Program starts at ' + fmt(program.programStart); nextIdx = 0; }
    else if (n < startM) banner = '<small>Doors open</small>Program starts at ' + fmt(program.programStart);
    else if (nowIdx >= 0) banner = '<small>Now</small>' + esc(items[nowIdx].title);
    else banner = '<small>Economic Forum 2026</small>Program complete';
    $('pbanner').innerHTML = banner;
    $('timeline').innerHTML = items.map(function (it, i) {
      var e = it.end ? toMin(it.end) : 24 * 60;
      var cls = i === nowIdx ? 'now' : i === nextIdx ? 'next' : (e <= n ? 'past' : '');
      var tag = cls === 'now' ? '<span class="tag">NOW</span>' : cls === 'next' ? '<span class="tag">NEXT</span>' : '';
      var inMin = toMin(it.start) - n;
      var inTxt = cls === 'next' ? '<div class="in">Starts in ' + (inMin >= 60 ? Math.floor(inMin / 60) + ' h ' + (inMin % 60) + ' min' : inMin + ' min') + '</div>' : '';
      return '<li class="seg ' + cls + '"><div class="t">' + fmt(it.start) + (it.end ? ' – ' + fmt(it.end) : ' onward') + tag + '</div>' +
        '<div class="ti">' + esc(it.title) + '</div>' + (it.who ? '<div class="who">' + esc(it.who) + '</div>' : '') + inTxt + '</li>';
    }).join('');
    var cur = $('timeline').querySelector('.now') || $('timeline').querySelector('.next');
    if (cur && !renderProgram.scrolled) { renderProgram.scrolled = true; cur.scrollIntoView({ block: 'center' }); }
  }

  function refreshStats() {
    call('stats', {}, function (s) {
      $('stats').textContent = 'Checked in: ' + s.checkedIn + ' / ' + s.total;
    });
  }

  function doSearch() {
    var q = $('q').value.trim();
    if (q.length < 2) { $('results').innerHTML = ''; msg(q.length ? 'Type at least 2 letters.' : ''); setBtn(false); return; }
    var my = ++seq;
    msg('Searching…');
    call('search', { q: q }, function (res) {
      if (my !== seq) return;
      msg(res.length ? '' : 'No matches.');
      render(res);
    });
  }

  function render(groups) {
    var html = groups.map(function (g) {
      var t = g.tickets.map(function (k) {
        return '<div class="ticket">' +
          '<div class="meta">ID ' + esc(k.id) + ' · ' + esc(k.ticketType || 'Ticket') + '</div>' +
          '<div class="tlabel">Table Number</div><div class="table' + (k.generalSeating ? ' general' : '') + '">' + esc(k.table) + '</div>' +
          (k.escort ? '<div class="escort">Refer to ' + esc(k.escort) + ' for seating</div>' : '') +
          '<div class="meta">Meal: ' + esc(k.meal || '—') + '</div>' +
          '<div class="status ' + (k.checkedIn ? 'yes' : 'no') + '">' + (k.checkedIn ? '✔ Checked in' : 'Not checked in') + '</div>' +
          '<button class="' + (k.checkedIn ? 'btn-out' : 'btn-in') + '" data-row="' + esc(k.row) + '" data-id="' + esc(k.id) + '">' +
          (k.checkedIn ? 'Undo check-in' : 'Check in') + '</button></div>';
      }).join('');
      return '<div class="card"><div class="name">' + esc(g.name) + '</div>' +
        (g.label ? '<div class="guest">' + esc(g.label) + '</div>' : '') + t + '</div>';
    }).join('');
    $('results').innerHTML = html + (groups.length ? '<button class="secondary newsearch" id="newSearch2">Reset</button>' : '');
    setBtn(groups.length > 0);
  }
  function setBtn(has) { var b = $('clearBtn'); b.textContent = has ? 'Reset' : 'Search'; b.className = has ? 'secondary' : 'btn-in'; }

  function resetSearch() { $('q').value = ''; $('results').innerHTML = ''; setBtn(false); msg(''); window.scrollTo(0, 0); $('q').focus(); }
  $('results').addEventListener('click', function (e) {
    if (e.target.closest('#newSearch2')) { resetSearch(); return; }
    var b = e.target.closest('button[data-row]');
    if (!b) return;
    b.disabled = true; b.textContent = 'Saving…';
    call('toggleCheckIn', { row: Number(b.getAttribute('data-row')), id: b.getAttribute('data-id') }, function (r) {
      msg((r.checkedIn ? 'Checked in ' : 'Unchecked ') + 'ID ' + r.id);
      doSearch(); refreshStats();
    });
  });

  $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(doSearch, 300); });
  $('clearBtn').addEventListener('click', function () { if ($('clearBtn').textContent === 'Reset') resetSearch(); else { clearTimeout(timer); doSearch(); } });
  $('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { clearTimeout(timer); doSearch(); } });

  function tryPin() {
    var p = $('pin').value.trim();
    if (!p) return;
    $('pinBtn').disabled = true; msg('Checking…');
    api({ action: 'verifyPin', pin: p }).then(function () {
      sessionStorage.setItem(PIN_KEY, p); $('pin').value = ''; msg(''); unlocked();
    }, function (e) { msg((e && e.message) || 'Invalid PIN', true); })
      .then(function () { $('pinBtn').disabled = false; });
  }
  $('pinBtn').addEventListener('click', tryPin);
  $('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryPin(); });

  if (pin()) unlocked();
})();
</script>
</body>
</html>
